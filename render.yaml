services:
  - type: web
    name: chatsplat-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: chatsplat-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chatsplat-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://chatsplat.app
      # Set these manually in the Render dashboard:
      # AGORA_APP_ID, AGORA_APP_CERTIFICATE
      # TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE
      # CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
      # OPENAI_API_KEY
      # FCM_SERVICE_ACCOUNT_JSON

databases:
  - name: chatsplat-db
    plan: free
    databaseName: chatsplat
    user: chatsplat

  - name: chatsplat-redis
    type: redis
    plan: free
    ipAllowList: []
